name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: prompt.wendealai.com
  LEGACY_DEMO_REF: v0.1.0-alpha
  LEGACY_DEMO_PATH: v0.1
  MOBILE_PREVIEW_PATH: v0.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build current prompt library demo
        run: VITE_DEMO_MODE=true VITE_DEMO_ASSET_VERSION=${GITHUB_SHA} VITE_BASE_PATH=/ npm run build
      - name: Stage current prompt library demo
        run: |
          mkdir -p .pages-artifact
          cp -R frontend/dist/. .pages-artifact/
          mkdir -p .pages-artifact/${MOBILE_PREVIEW_PATH}
          cp -R frontend/dist/. .pages-artifact/${MOBILE_PREVIEW_PATH}/
      - name: Build archived v0.1 demo
        id: legacy-demo
        run: |
          git fetch --tags origin
          if ! git rev-parse --verify --quiet "${LEGACY_DEMO_REF}^{commit}"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping archived demo because ${LEGACY_DEMO_REF} is unavailable."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          git worktree add .page-build/${LEGACY_DEMO_PATH} ${LEGACY_DEMO_REF}
          cd .page-build/${LEGACY_DEMO_PATH}
          npm install
          VITE_DEMO_MODE=true VITE_DEMO_ASSET_VERSION=${GITHUB_SHA} VITE_BASE_PATH=/${LEGACY_DEMO_PATH}/ npm run build
      - name: Stage archived v0.1 demo
        if: steps.legacy-demo.outputs.available == 'true'
        run: |
          mkdir -p .pages-artifact/${LEGACY_DEMO_PATH}
          cp -R .page-build/${LEGACY_DEMO_PATH}/frontend/dist/. .pages-artifact/${LEGACY_DEMO_PATH}/
      - name: Write archived v0.1 fallback
        if: steps.legacy-demo.outputs.available != 'true'
        run: |
          mkdir -p .pages-artifact/${LEGACY_DEMO_PATH}
          cat > .pages-artifact/${LEGACY_DEMO_PATH}/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=../" />
              <title>Archived demo unavailable</title>
            </head>
            <body>
              <p>The archived v0.1 demo is unavailable. Open <a href="../">the current demo</a>.</p>
            </body>
          </html>
          HTML
      - name: Configure custom domain
        run: |
          echo "${CUSTOM_DOMAIN}" > .pages-artifact/CNAME
          touch .pages-artifact/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
