[project]
name = "image-prompt-library"
version = "0.1.0"
description = "Local-first image prompt reference library"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "httpx>=0.27",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E402", "E501", "E701", "E702"]

[tool.setuptools]
packages = ["backend", "backend.routers", "backend.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
